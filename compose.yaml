services:
  postgres:
    image: postgres:16-alpine
    container_name: meterdesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meterdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meterdesk}
      POSTGRES_DB: ${POSTGRES_DB:-meterdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meterdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meterdesk} -d ${POSTGRES_DB:-meterdesk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meterdesk-postgres-data:
