x-api-image: &api-image
  image: ${API_IMAGE:-meterdesk-api:local}
  build:
    context: .
    dockerfile: apps/api/Dockerfile

x-api-environment: &api-environment
  DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-meterdesk}:${POSTGRES_PASSWORD:-meterdesk}@postgres:5432/${POSTGRES_DB:-meterdesk}}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL-https://api.openai.com/v1}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEMO_AUTH_SIGNING_KEY: ${DEMO_AUTH_SIGNING_KEY:-meterdesk-local-demo-only-hs256-signing-key-change-before-sharing-2026}
  DEMO_AUTH_TOKEN_TTL_SECONDS: ${DEMO_AUTH_TOKEN_TTL_SECONDS:-28800}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meterdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meterdesk}
      POSTGRES_DB: ${POSTGRES_DB:-meterdesk}
    ports:
      - "${CONTAINER_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meterdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-meterdesk} -d ${POSTGRES_DB:-meterdesk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api-image
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  seed:
    <<: *api-image
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "meterdesk_api.seed"]

  api:
    <<: *api-image
    environment: *api-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "${CONTAINER_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ${WEB_IMAGE:-meterdesk-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CONTAINER_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"

volumes:
  meterdesk-postgres-data:
